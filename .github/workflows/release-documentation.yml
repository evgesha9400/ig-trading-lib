name: Release versioned documentation

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable v* tag to recover after a failed documentation release"
        required: false
        type: string

permissions:
  contents: read

env:
  LIBRARY_REPOSITORY: evgesha9400/ig-trading-lib
  PORTAL_REPOSITORY: evgesha9400/evgesha9400.github.io
  PORTAL_WORKFLOW: rebuild-library-pages.yml
  PORTAL_REF: main

concurrency:
  group: ig-trading-lib-versioned-documentation
  cancel-in-progress: false

jobs:
  validate-documentation:
    name: Validate documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install "poetry==2.3.2"

      - name: Validate lock and install documentation dependencies
        run: |
          poetry check --lock
          poetry sync --with dev

      - name: Validate documentation and release workflow
        run: |
          make docs-check
          make workflow-check

  validate-release:
    name: Validate release tag
    needs: validate-documentation
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      is_stable: ${{ steps.release.outputs.is_stable }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - id: release
        name: Derive a safe SemVer release identity
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?(\+([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$'

          if [[ ! "$TAG" =~ $semver_pattern ]]; then
            echo "::error::Release tags must use SemVer and begin with v (for example v3.0.0)."
            exit 1
          fi

          tag_ref="refs/tags/$TAG"
          if ! git show-ref --verify --quiet "$tag_ref"; then
            echo "::error::Release tag $TAG is unavailable."
            exit 1
          fi
          if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
            echo "::error::Release tag $TAG must be annotated."
            exit 1
          fi
          direct_target_type="$(git cat-file -p "$tag_ref" | awk '$1 == "type" { print $2; exit }')"
          if [[ "$direct_target_type" != "commit" ]]; then
            echo "::error::Release tag $TAG must directly target a commit."
            exit 1
          fi
          if [[ "$(git cat-file -t "$TAG^{}")" != "commit" ]]; then
            echo "::error::Release tag $TAG must resolve to a commit."
            exit 1
          fi

          commit="$(git rev-parse "$tag_ref^{}")"
          if [[ "$(git rev-parse HEAD)" != "$commit" ]]; then
            echo "::error::Release checkout does not match tag $TAG."
            exit 1
          fi

          version="${TAG#v}"
          package_version="$(python -c '
          import tomllib
          from pathlib import Path

          print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          ')"
          if [[ "$version" != "$package_version" ]]; then
            echo "::error::Release tag $TAG does not match pyproject.toml version $package_version."
            exit 1
          fi

          is_stable=true
          if [[ "$version" == *-* ]]; then
            is_stable=false
          fi

          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "commit=$commit"
            echo "is_stable=$is_stable"
          } >> "$GITHUB_OUTPUT"

  verify-release-commit:
    name: Verify release commit on Python ${{ matrix.python-version }}
    needs: validate-release
    if: needs.validate-release.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-release.outputs.tag }}

      - name: Prove tag, production, and development branch equality
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.validate-release.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main develop

          if [[ "$RELEASE_COMMIT" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::Release tag commit must equal origin/main."
            exit 1
          fi
          if [[ "$(git rev-parse origin/main)" != "$(git rev-parse origin/develop)" ]]; then
            echo "::error::origin/main and origin/develop must be identical before release."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry and export plugin
        run: |
          pipx install "poetry==2.3.2"
          pipx inject poetry poetry-plugin-export

      - name: Install and verify the exact release commit
        run: |
          poetry check --lock
          poetry sync --with dev
          make verify

  publish-versioned-documentation:
    name: Publish immutable versioned documentation
    needs: [validate-release, verify-release-commit]
    if: needs.validate-release.result == 'success' && needs.verify-release-commit.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-release.outputs.tag }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install "poetry==2.3.2"

      - name: Install documentation dependencies
        run: poetry sync --with dev

      - name: Configure generated documentation commit identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages when it already exists
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --heads origin gh-pages >/dev/null
          status=$?
          set -e

          case "$status" in
            0)
              git fetch --no-tags origin gh-pages:refs/remotes/origin/gh-pages
              ;;
            2)
              echo "gh-pages does not exist yet; this is the first documentation release."
              ;;
            *)
              echo "::error::Unable to inspect the gh-pages branch."
              exit "$status"
              ;;
          esac

      - name: Refuse to replace immutable versioned documentation
        shell: bash
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
          COMMIT: ${{ needs.validate-release.outputs.commit }}
          ALLOW_EXISTING_DOCUMENTATION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        run: |
          set -euo pipefail
          poetry run mike list --json > /tmp/ig-trading-lib-mike-versions.json

          if poetry run python -c '
          import json
          import sys

          version = sys.argv[1]
          versions = json.load(sys.stdin)
          raise SystemExit(0 if any(item["version"] == version for item in versions) else 1)
          ' "$VERSION" < /tmp/ig-trading-lib-mike-versions.json; then
            if [[ "$ALLOW_EXISTING_DOCUMENTATION" != "true" ]]; then
              echo "::error::Documentation for $VERSION already exists and is immutable."
              exit 1
            fi

            short_commit="$(git rev-parse --short=7 "$COMMIT")"
            expected_deployment="Deployed $short_commit to $VERSION with MkDocs"
            if ! git log origin/gh-pages --format=%s | grep --fixed-strings --quiet -- "$expected_deployment"; then
              echo "::error::Existing documentation for $VERSION does not prove deployment from release commit $COMMIT."
              exit 1
            fi

            echo "Documentation for $VERSION is already immutable from $COMMIT; retaining it during explicit recovery."
            echo "DOCUMENTATION_ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
          fi

      - name: Publish the immutable version and stable latest alias
        shell: bash
        env:
          VERSION: ${{ needs.validate-release.outputs.version }}
          IS_STABLE: ${{ needs.validate-release.outputs.is_stable }}
        run: |
          set -euo pipefail

          if [[ "${DOCUMENTATION_ALREADY_PUBLISHED:-false}" == "true" ]]; then
            echo "Retaining existing immutable documentation; no Pages files will be changed."
            exit 0
          fi

          if [[ "$IS_STABLE" == "true" ]]; then
            poetry run mike deploy --push --update-aliases --alias-type redirect "$VERSION" latest
            poetry run mike set-default --push latest
            exit 0
          fi

          poetry run mike deploy --push "$VERSION"
          echo "Pre-release documentation published at /$VERSION/; latest was not changed."

  publish-python-package:
    name: Publish Python package to PyPI
    needs: [validate-release, verify-release-commit, publish-versioned-documentation]
    if: needs.publish-versioned-documentation.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-release.outputs.tag }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install "poetry==2.3.2"

      - name: Build the validated release package
        run: poetry build

      - name: Publish the package to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}

  create-github-release:
    name: Create GitHub Release record
    needs: [validate-release, verify-release-commit, publish-versioned-documentation, publish-python-package]
    if: needs.publish-versioned-documentation.result == 'success' && needs.publish-python-package.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release record
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-release.outputs.tag }}
          IS_STABLE: ${{ needs.validate-release.outputs.is_stable }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$LIBRARY_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; keeping it unchanged."
            exit 0
          fi

          release_flags=(--verify-tag --title "$TAG" --generate-notes)
          if [[ "$IS_STABLE" != "true" ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$TAG" "${release_flags[@]}" --repo "$LIBRARY_REPOSITORY"

  dispatch-portal-rebuild:
    name: Dispatch portal rebuild
    needs: [validate-release, verify-release-commit, publish-versioned-documentation, publish-python-package, create-github-release]
    if: needs.publish-versioned-documentation.result == 'success' && needs.publish-python-package.result == 'success' && needs.create-github-release.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dispatch the portal workflow when its token is configured
        shell: bash
        env:
          PORTAL_TOKEN: ${{ secrets.LIBRARY_PORTAL_DISPATCH_TOKEN }}
          TAG: ${{ needs.validate-release.outputs.tag }}
          VERSION: ${{ needs.validate-release.outputs.version }}
          COMMIT: ${{ needs.validate-release.outputs.commit }}
        run: |
          set -euo pipefail

          if [[ -z "$PORTAL_TOKEN" ]]; then
            echo "Portal dispatch skipped: LIBRARY_PORTAL_DISPATCH_TOKEN is unavailable."
            exit 0
          fi

          GH_TOKEN="$PORTAL_TOKEN" gh workflow run "$PORTAL_WORKFLOW" \
            --repo "$PORTAL_REPOSITORY" \
            --ref "$PORTAL_REF" \
            -f "repository=$LIBRARY_REPOSITORY" \
            -f "tag=$TAG" \
            -f "version=$VERSION" \
            -f "commit=$COMMIT"
