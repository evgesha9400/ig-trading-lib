name: Verify Python package

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry and export plugin
        run: |
          pipx install poetry
          pipx inject poetry poetry-plugin-export

      - name: Validate lock and install dependencies
        run: |
          poetry check --lock
          poetry sync --with dev

      - name: Install Chromium for documentation browser checks
        run: poetry run playwright install --with-deps chromium

      - name: Format and lint
        run: |
          poetry run ruff format --check src tests scripts examples
          poetry run ruff check src tests scripts examples

      - name: Type check
        run: poetry run pyright

      - name: Validate documentation contract and site
        run: |
          make docs-check
          make workflow-check

      - name: Test with coverage
        run: poetry run pytest tests/unit

      - name: Build package
        run: poetry build

      - name: Audit dependencies
        run: |
          poetry export --only main --without-hashes --output /tmp/requirements.txt
          poetry run pip-audit --strict --requirement /tmp/requirements.txt
