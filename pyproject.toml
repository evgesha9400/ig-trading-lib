[project]
name = "ig-trading-lib"
version = "4.0.1"
description = "Typed IG operations and safe trading workflows for Python"
authors = [{ name = "Evgeny Aleshin" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cryptography>=50.0.0,<51.0.0",
    "httpx>=0.28.1,<1.0.0",
    "idna>=3.15,<4.0.0",
    "lightstreamer-client-lib>=2.2.2,<3.0.0",
    "pydantic>=2.11.9,<3.0.0",
]

[project.urls]
Documentation = "https://evgesha9400.github.io/ig-trading-lib/latest/"
Source = "https://github.com/evgesha9400/ig-trading-lib"
Issues = "https://github.com/evgesha9400/ig-trading-lib/issues"

[tool.poetry]
packages = [{ include = "ig_trading_lib", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-mock = "^3.15.1"
pytest-asyncio = "^0.26.0"
pytest-cov = "^6.2.1"
respx = "^0.22.0"
hypothesis = "^6.131.9"
ruff = "^0.11.13"
pyright = "^1.1.402"
python-dotenv = "^1.1.1"
pip-audit = "^2.9.0"
mkdocs-material = ">=9.7,<10.0"
mkdocstrings = {version = ">=1.0,<2.0", extras = ["python"]}
mike = ">=2.2,<3.0"
pyyaml = ">=6.0,<7.0"
playwright = "^1.61.0"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=ig_trading_lib --cov-fail-under=90"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
testpaths = ["tests/unit/v4"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
