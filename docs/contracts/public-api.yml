mutation_safety_rules:
- id: permit-scope
  path: docs/api-guide/trading-safety.md
  text: Guarded typed mutations are positions.create, positions.update, positions.close, accounts.update_preferences,
    and create, update, or delete on watchlists, working_orders, costs, and applications.
- id: unguarded-resource-scope
  path: docs/api-guide/trading-safety.md
  text: 'Do not infer that every ResourceClient mutation is guarded: guards are installed only for the
    typed client attributes named above.'
- id: ambiguous-execution
  path: docs/api-guide/trading-safety.md
  text: After AmbiguousExecutionError, verify the outcome with a confirmation or relevant deal reference
    before considering another mutation.
