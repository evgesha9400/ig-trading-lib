schema_version: 1

parameter_descriptions:
  account_id: IG account identifier to switch to.
  allowance_account_overall: Overall request allowance assigned to the application.
  allowance_account_trading: Trading request allowance assigned to the application.
  api_key: Application API key whose settings are updated.
  ask: Current provider ask price used for an indicative calculation.
  bid: Current provider bid price used for an indicative calculation.
  category_id: IG market-navigation category identifier.
  currency_code: Three-letter deal currency code.
  deal_currency_code: Three-letter currency code used for the cost calculation.
  deal_id: IG identifier of an existing position or working order.
  deal_reference: Client or provider reference used to correlate a deal.
  default_account: Whether the switched account becomes the login default.
  detailed: Whether IG should include detailed activity records.
  direction: Deal direction; `BUY` or `SELL`.
  edit_type: Provider edit-cost calculation type.
  end_date: Inclusive end of the requested time range.
  epic: IG market epic.
  epics: Ordered collection of IG market epics.
  expiry: Market expiry, or `-` for a non-expiring market.
  fetch_session_tokens: Whether CST and XST session tokens are requested from IG.
  filter: Provider filter controlling the records or market detail returned.
  force_open: Whether the deal must create a separate position.
  from_date: Inclusive beginning of the requested time range.
  good_till_date: Expiry timestamp for a `GOOD_TILL_DATE` working order.
  guaranteed_stop: Whether the stop is guaranteed by IG.
  hedging_mode: Provider account hedging preference.
  instrument_id: Provider instrument identifier used by indicative-cost operations.
  items: Lightstreamer item names included in the subscription.
  fields: Lightstreamer fields requested for every item.
  data_adapter: Optional Lightstreamer data-adapter name.
  key: Caller-defined key copied to every stream update.
  max_frequency: Maximum update frequency requested from Lightstreamer.
  mode: Lightstreamer subscription mode; `MERGE` or `DISTINCT`.
  snapshot: Whether Lightstreamer should send an initial snapshot.
  knockout_premium: Knockout premium used in an indicative-cost calculation.
  level: Requested order or quote price level.
  limit_distance: Limit distance in market points; mutually exclusive with `limit_level`.
  limit_level: Absolute limit level; mutually exclusive with `limit_distance`.
  market_id: IG client-sentiment market identifier.
  market_ids: Optional collection of IG client-sentiment market identifiers.
  maturity_type: Optional provider maturity filter for category instruments.
  max_points: Maximum number of historical price points to return.
  max_span_seconds: Maximum transaction-history span in seconds.
  name: User-visible watchlist name.
  num_points: Number of historical price points requested.
  opening_level: Original opening price used for close or edit cost calculations.
  order_type: Provider order type for the requested deal.
  page_number: Provider page number.
  page_size: Maximum records requested per provider page.
  period: ISO-8601-style provider period such as `P7D`.
  price_level: Current price level used in an indicative-cost calculation.
  query: Optional typed query controls; `None` uses provider defaults.
  quote_id: IG quote identifier required for a `QUOTE` order.
  quote_reference: IG indicative-cost quote reference.
  reference_epic: Optional epic used as a category-navigation reference point.
  request: Validated typed request body.
  resolution: IG historical-price resolution.
  search_term: Text matched against IG market names and identifiers.
  size: Positive deal size.
  start_date: Inclusive beginning of the requested time range.
  status: Application status to assign.
  stop_distance: Stop distance in market points; mutually exclusive with `stop_level`.
  stop_level: Absolute stop level; mutually exclusive with `stop_distance`.
  subscription: Declarative Lightstreamer subscription specification.
  time_in_force: Provider rule controlling how long or how aggressively an order executes.
  to_date: Inclusive end of the requested time range.
  trailing_stop: Whether trailing-stop behavior is enabled.
  trailing_stop_distance: Distance maintained by an amended trailing stop.
  trailing_stop_enabled: Whether trailing stops are enabled for the account.
  trailing_stops_enabled: Whether trailing stops are enabled for the account.
  trailing_stop_increment: Minimum movement before a trailing stop advances.
  transaction_type: Provider transaction category filter.
  type: Provider history or transaction type filter.
  watchlist_id: IG watchlist identifier.

exceptions:
  AuthenticationError:
    trigger: IG rejected the credentials, required session values were absent, or refresh failed.
    recovery: Re-authenticate with valid credentials before retrying.
  AuthorizationError:
    trigger: The active account cannot access the requested resource or action.
    recovery: Switch to an entitled account or request the required IG permission.
  RateLimitError:
    trigger: IG rejected the request because an allowance was exhausted.
    recovery: Wait for `retry_after_seconds` when present, then retry with bounded backoff.
  ProviderRejectionError:
    trigger: IG rejected an otherwise well-formed request.
    recovery: Inspect `error_code` and correct the provider-specific input or account state.
  ResourceNotFoundError:
    trigger: The requested provider resource does not exist or is inaccessible.
    recovery: Verify the identifier and active account before retrying.
  TransportError:
    trigger: A network or timeout failure prevented a completed read request.
    recovery: Retry the idempotent read with bounded backoff.
  AmbiguousExecutionError:
    trigger: A mutation may have reached IG before a network or timeout failure.
    recovery: Reconcile account state or query by deal reference; never replay blindly.
  LiveTradingPermissionError:
    trigger: A live-environment mutation was called without an acknowledged `TradingPermit`.
    recovery: Construct the client with an explicit `TradingPermit` after confirming live intent.
  DealConfirmationError:
    trigger: IG accepted a mutation but its follow-up confirmation could not be retrieved.
    recovery: Preserve `deal_reference` from the exception and reconcile it; do not replay the mutation.
  StreamingSubscriptionError:
    trigger: IG or Lightstreamer rejected the subscription.
    recovery: Correct the item, field, mode, entitlement, or adapter before resubscribing.
  StreamingDataLossError:
    trigger: IG reported lost updates or the local consumer exhausted its stream buffer.
    recovery: Treat local state as stale, obtain a fresh snapshot, then resubscribe.
  ValidationError:
    trigger: Request construction failed or an IG response did not match the declared model.
    recovery: Correct invalid request fields; report provider response drift with redacted diagnostics.
  ValueError:
    trigger: A direct method argument violates a local rule.
    recovery: Correct the argument before calling IG again.

exception_profiles:
  read: [AuthenticationError, AuthorizationError, RateLimitError, ProviderRejectionError, ResourceNotFoundError, TransportError, ValidationError]
  mutation: [AuthenticationError, AuthorizationError, RateLimitError, ProviderRejectionError, ResourceNotFoundError, AmbiguousExecutionError, LiveTradingPermissionError, ValidationError]
  workflow_read: [AuthenticationError, AuthorizationError, RateLimitError, ProviderRejectionError, ResourceNotFoundError, TransportError, ValidationError]
  workflow_mutation: [AuthenticationError, AuthorizationError, RateLimitError, ProviderRejectionError, ResourceNotFoundError, AmbiguousExecutionError, LiveTradingPermissionError, DealConfirmationError, ValidationError]
  streaming: [AuthenticationError, StreamingSubscriptionError, StreamingDataLossError]
  none: []

limitation_profiles:
  read:
    - Returned resources and fields depend on the active account, environment, entitlements, and current IG catalogue.
    - IG can change account-specific allowances and availability independently of this library.
  mutation:
    - Live calls require an explicit `TradingPermit`; demo calls do not.
    - Mutations are sent once and are never automatically retried after an uncertain outcome.
  workflow_read:
    - A workflow performs multiple IG requests and does not provide a transactional snapshot.
    - Returned resources depend on the active account and may change between requests.
  workflow_mutation:
    - A workflow performs a mutation followed by a separate confirmation request.
    - Confirmation failure does not roll back an accepted mutation.
  streaming:
    - Streams are long-lived and require the consumer to keep pace with the configured local buffer.
    - Recovery can reconnect once, but consumers must rebuild state after any reported data loss.
  none:
    - No library-specific failure is expected during normal local cleanup.

methods:
  operations.accounts.list:
    summary: List every account available to the authenticated client.
    official_reference: https://labs.ig.com/reference/accounts.html
    arguments: {}
    limitation_profile: read
    limitations: []
    exception_profile: read
    exceptions: []
  operations.accounts.get_preferences:
    summary: Read trading preferences for the active account.
    official_reference: https://labs.ig.com/reference/accounts-preferences.html
    arguments: {}
    limitation_profile: read
    limitations: []
    exception_profile: read
    exceptions: []
  operations.accounts.update_preferences:
    summary: Update trading preferences for the active account.
    official_reference: https://labs.ig.com/reference/accounts-preferences.html
    arguments: {request: "UpdateAccountPreferencesRequest(trailing_stops_enabled=True)"}
    limitation_profile: mutation
    limitations: ["Only fields supported by the account type can be changed."]
    exception_profile: mutation
    exceptions: []
  operations.activity.list:
    summary: List account activity with the v3 query controls.
    official_reference: https://labs.ig.com/reference/history-activity.html
    arguments: {query: "ActivityQuery(page_size=50)"}
    limitation_profile: read
    limitations: ["IG restricts activity history to provider-defined date and page windows."]
    exception_profile: read
    exceptions: []
  operations.activity.list_by_date_range:
    summary: List account activity between two dates using the v2 endpoint.
    official_reference: https://labs.ig.com/reference/history-activity-dates.html
    arguments: {from_date: '"2026-08-01"', to_date: '"2026-08-08"'}
    limitation_profile: read
    limitations: ["Date strings must use a format accepted by IG."]
    exception_profile: read
    exceptions: []
  operations.activity.list_by_period:
    summary: List recent account activity for a provider period.
    official_reference: https://labs.ig.com/reference/history-activity-period.html
    arguments: {period: '"P7D"'}
    limitation_profile: read
    limitations: ["Supported period syntax and maximum history are controlled by IG."]
    exception_profile: read
    exceptions: []
  operations.applications.list:
    summary: List API applications associated with the authenticated client.
    official_reference: https://labs.ig.com/reference/operations-application.html
    arguments: {}
    limitation_profile: read
    limitations: ["Application administration may require elevated account permissions."]
    exception_profile: read
    exceptions: []
  operations.applications.update:
    summary: Update one API application's status and allowances.
    official_reference: https://labs.ig.com/reference/operations-application.html
    arguments: {request: 'UpdateApplicationRequest(api_key="example-key", status="ENABLED", allowance_account_overall=60, allowance_account_trading=30)'}
    limitation_profile: mutation
    limitations: ["IG can cap requested allowances below the supplied values."]
    exception_profile: mutation
    exceptions: []
  operations.applications.disable:
    summary: Disable the API key used by the current session.
    official_reference: https://labs.ig.com/reference/operations-application-disable.html
    arguments: {}
    limitation_profile: mutation
    limitations: ["Disabling the current key can prevent subsequent calls from the client."]
    exception_profile: mutation
    exceptions: []
  operations.categories.list:
    summary: List top-level market-navigation categories.
    official_reference: https://labs.ig.com/reference/categories.html
    arguments: {}
    limitation_profile: read
    limitations: []
    exception_profile: read
    exceptions: []
  operations.categories.list_instruments:
    summary: List instruments inside a market-navigation category.
    official_reference: https://labs.ig.com/reference/categories-category-id-instruments.html
    arguments: {category_id: '"CURRENCIES"', query: "CategoryInstrumentsQuery(page_size=100)"}
    limitation_profile: read
    limitations: ["`page_size` is limited to 1-1000 and `page_number` starts at 0."]
    exception_profile: read
    exceptions: []
  operations.client_sentiment.list:
    summary: List client sentiment, optionally restricted to market identifiers.
    official_reference: https://labs.ig.com/reference/client-sentiment.html
    arguments: {market_ids: '("EURUSD", "GBPUSD")'}
