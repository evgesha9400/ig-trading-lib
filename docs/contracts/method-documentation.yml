    official_reference: https://labs.ig.com/reference/markets.html
    arguments: {epics: '("CS.D.EURUSD.CFD.IP",)', filter: '"ALL"'}
    limitation_profile: read
    limitations: ["`epics` must contain 1-50 non-empty identifiers; `SNAPSHOT_ONLY` returns reduced detail."]
    exception_profile: read
    exceptions:
      - ValueError:
          trigger: "`epics` is empty, exceeds 50 items, or contains an empty identifier."
  operations.markets.search:
    summary: Search for markets by name or identifier.
    official_reference: https://labs.ig.com/reference/markets-searchterm.html
    arguments: {search_term: '"EUR/USD"'}
    response_example:
      markets:
        - epic: CS.D.EURUSD.CFD.IP
          instrumentName: EUR/USD
          marketStatus: TRADEABLE
          bid: '1.08120'
          offer: '1.08135'
    limitation_profile: read
    limitations: ["`search_term` must contain at least one non-whitespace character."]
    exception_profile: read
    exceptions:
      - ValueError:
          trigger: "`search_term` is empty or contains only whitespace."
  operations.markets.get:
    summary: Retrieve details, snapshot, and dealing rules for one market epic.
    official_reference: https://labs.ig.com/reference/markets-epic.html
    arguments: {epic: '"CS.D.EURUSD.CFD.IP"'}
    limitation_profile: read
    limitations: ["`epic` must contain at least one non-whitespace character."]
    exception_profile: read
    exceptions:
      - ValueError:
          trigger: "`epic` is empty or contains only whitespace."
  operations.positions.list:
    summary: List all open positions for the active account.
    official_reference: https://labs.ig.com/reference/positions.html
    arguments: {}
    limitation_profile: read
    limitations: []
    exception_profile: read
    exceptions: []
  operations.positions.get:
    summary: Retrieve one open position by deal identifier.
    official_reference: https://labs.ig.com/reference/positions-deal-id.html
    arguments: {deal_id: '"DIAAAABBBCCC"'}
    limitation_profile: read
    limitations: ["The position must belong to the active account."]
    exception_profile: read
    exceptions: []
  operations.positions.create:
    summary: Create an OTC position and return its deal reference.
    official_reference: https://labs.ig.com/reference/positions-otc.html
    arguments: {request: 'CreatePositionRequest(epic="CS.D.EURUSD.CFD.IP", direction="BUY", size="1", order_type="MARKET", currency_code="GBP")'}
    limitation_profile: mutation
    limitations: ["Order-level, stop, limit, force-open, quote, and trailing-stop combinations are validated before sending."]
    exception_profile: mutation
    exceptions: []
  operations.positions.amend:
    summary: Amend stops or limits on an open position.
    official_reference: https://labs.ig.com/reference/positions-otc-deal-id.html
    arguments: {deal_id: '"DIAAAABBBCCC"', request: 'AmendPositionRequest(limit_level="1.0900")'}
    limitation_profile: mutation
    limitations: ["Guaranteed and trailing-stop amendments require provider-valid field combinations."]
    exception_profile: mutation
    exceptions: []
  operations.positions.close:
    summary: Close all or part of an OTC position.
    official_reference: https://labs.ig.com/reference/positions-otc.html
    arguments: {request: 'ClosePositionRequest(direction="SELL", size="1", deal_id="DIAAAABBBCCC")'}
    limitation_profile: mutation
    limitations: ["Identify the position by exactly one of `deal_id` or `epic`; `epic` also requires `expiry`."]
    exception_profile: mutation
    exceptions: []
