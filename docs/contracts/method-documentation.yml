    limitations: ["The response contains binary document bytes and may be unavailable after IG's retention window."]
    exception_profile: read
    exceptions: []
  operations.indicative_costs.history:
    summary: List historical indicative-cost disclosures for a date range.
    official_reference: https://labs.ig.com/reference/indicative-costs-and-charges-history-dates.html
