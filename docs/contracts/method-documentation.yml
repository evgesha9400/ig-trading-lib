    official_reference: https://labs.ig.com/reference/session.html
    arguments: {}
    limitation_profile: mutation
    limitations: ["A successful call makes subsequent operations authenticate again."]
    exception_profile: mutation
    exceptions: []
  operations.session.get_encryption_key:
    summary: Retrieve IG's password-encryption key and timestamp.
    official_reference: https://labs.ig.com/reference/session-encryption-key.html
    arguments: {}
    limitation_profile: read
    limitations: ["The key is time-sensitive and intended only for IG's encrypted-login flow."]
    exception_profile: read
    exceptions: []
  operations.streaming.subscribe:
    summary: Subscribe to Lightstreamer updates as a sync or async iterator.
    official_reference: https://labs.ig.com/streaming-api-reference.html
    arguments: {subscription: 'StreamSubscription(key="prices", mode="MERGE", items=("MARKET:CS.D.EURUSD.CFD.IP",), fields=("BID", "OFFER"))'}
    limitation_profile: streaming
    limitations: ["The sync method returns `Iterator[StreamUpdate]`; the async method returns `AsyncIterator[StreamUpdate]`."]
    exception_profile: streaming
    exceptions: []
  operations.streaming.close:
    summary: Unsubscribe active streams and close the Lightstreamer connection.
    official_reference: https://labs.ig.com/streaming-api-reference.html
    arguments: {}
