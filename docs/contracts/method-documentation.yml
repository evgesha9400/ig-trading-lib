    arguments: {epic: '"CS.D.EURUSD.CFD.IP"', query: 'PricesQuery(resolution="HOUR", max_points=100)'}
    limitation_profile: read
    limitations: ["IG historical-price allowances and maximum ranges vary by account and resolution."]
    exception_profile: read
    exceptions: []
  operations.prices.list_points:
    summary: List a fixed number of historical price points using the v2 endpoint.
    official_reference: https://labs.ig.com/reference/prices-epic-resolution-numpoints.html
    arguments: {epic: '"CS.D.EURUSD.CFD.IP"', resolution: '"HOUR"', num_points: '100'}
    limitation_profile: read
    limitations: ["Resolution values and point limits are enforced by IG."]
    exception_profile: read
    exceptions: []
  operations.prices.list_date_range:
    summary: List historical prices for an explicit date range using the v2 endpoint.
    official_reference: https://labs.ig.com/reference/prices-epic-dates-new.html
    arguments: {epic: '"CS.D.EURUSD.CFD.IP"', resolution: '"HOUR"', start_date: '"2026-08-01T00:00:00"', end_date: '"2026-08-08T00:00:00"'}
    limitation_profile: read
    limitations: ["Date format, range length, resolution, and allowance are enforced by IG."]
    exception_profile: read
    exceptions: []
  operations.repeat_dealing_window.get:
