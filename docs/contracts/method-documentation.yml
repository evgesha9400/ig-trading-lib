    exceptions: []
  operations.indicative_costs.quote_open:
    summary: Calculate indicative costs for opening a position.
    official_reference: https://labs.ig.com/reference/indicative-costs-and-charges-open.html
    arguments: {request: 'OpenIndicativeCostRequest(ask="1.0813", bid="1.0812", deal_currency_code="GBP", deal_reference="COST-1", size="1")'}
