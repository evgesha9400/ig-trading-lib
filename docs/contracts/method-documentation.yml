    limitations: ["The result is indicative and can differ from costs at execution time."]
    exception_profile: read
    exceptions: []
  operations.indicative_costs.quote_close:
    summary: Calculate indicative costs for closing a position.
    official_reference: https://labs.ig.com/reference/indicative-costs-and-charges-close.html
    arguments: {request: 'CloseIndicativeCostRequest(ask="1.0813", bid="1.0812", deal_currency_code="GBP", deal_reference="COST-2", size="1", opening_level="1.0700")'}
    limitation_profile: read
    limitations: ["The result is indicative and requires the original opening level."]
    exception_profile: read
    exceptions: []
  operations.indicative_costs.quote_edit:
    summary: Calculate indicative costs for editing a position.
    official_reference: https://labs.ig.com/reference/indicative-costs-and-charges-edit.html
    arguments: {request: 'EditIndicativeCostRequest(ask="1.0813", bid="1.0812", deal_currency_code="GBP", deal_reference="COST-3", size="1", opening_level="1.0700")'}
    limitation_profile: read
    limitations: ["The result is indicative and depends on the supplied edit context."]
    exception_profile: read
    exceptions: []
  operations.indicative_costs.get_durable_medium:
    summary: Download the durable-medium document for an indicative quote.
