    official_reference: https://labs.ig.com/reference/repeat-deal-window.html
    arguments: {epic: '"CS.D.EURUSD.CFD.IP"'}
    limitation_profile: read
    limitations: ["Repeat-dealing eligibility and expiry are determined by IG in real time."]
    exception_profile: read
    exceptions: []
  operations.session.get:
    summary: Read the active session and optionally request CST/XST tokens.
    official_reference: https://labs.ig.com/reference/session.html
    arguments: {fetch_session_tokens: 'True'}
    limitation_profile: read
    limitations: ["Session tokens are sensitive, excluded from model repr, and must never be logged."]
    exception_profile: read
    exceptions: []
  operations.session.switch_account:
