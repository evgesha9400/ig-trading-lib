    official_reference: https://labs.ig.com/reference/watchlists-watchlist-id-epic.html
    arguments: {watchlist_id: '"12345"', request: 'AddWatchlistMarketRequest(epic="CS.D.EURUSD.CFD.IP")'}
    limitation_profile: mutation
    limitations: ["The market must be available and the watchlist must have remaining capacity."]
    exception_profile: mutation
    exceptions: []
  operations.watchlists.delete:
    summary: Delete one watchlist.
    official_reference: https://labs.ig.com/reference/watchlists-watchlist-id.html
    arguments: {watchlist_id: '"12345"'}
    limitation_profile: mutation
    limitations: ["Deletion is permanent at IG and does not delete any market."]
    exception_profile: mutation
    exceptions: []
