    arguments: {}
    limitation_profile: read
    limitations: []
    exception_profile: read
    exceptions: []
  operations.watchlists.create:
    summary: Create a watchlist with an optional initial market set.
    official_reference: https://labs.ig.com/reference/watchlists.html
    arguments: {request: 'CreateWatchlistRequest(name="FX majors", epics=("CS.D.EURUSD.CFD.IP",))'}
    limitation_profile: mutation
    limitations: ["The name must be non-empty; market and watchlist limits are controlled by IG."]
    exception_profile: mutation
    exceptions: []
  operations.watchlists.get:
    summary: Retrieve one watchlist and its markets.
    official_reference: https://labs.ig.com/reference/watchlists-watchlist-id.html
    arguments: {watchlist_id: '"12345"'}
    limitation_profile: read
    limitations: ["The watchlist must belong to the active account."]
    exception_profile: read
    exceptions: []
  operations.watchlists.add_market:
