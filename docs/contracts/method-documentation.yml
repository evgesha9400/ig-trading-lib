    official_reference: https://labs.ig.com/reference/client-sentiment-related-market-id.html
    arguments: {market_id: '"EURUSD"'}
    limitation_profile: read
    limitations: ["Related markets are selected by IG and may be empty."]
    exception_profile: read
    exceptions: []
  operations.confirmations.get:
    summary: Retrieve the final confirmation for a deal reference.
