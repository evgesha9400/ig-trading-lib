site_name: IG Trading Library
site_description: Safe, typed synchronous and asynchronous IG REST and streaming clients.
site_url: https://evgesha9400.github.io/ig-trading-lib
repo_url: https://github.com/evgesha9400/ig-trading-lib
repo_name: evgesha9400/ig-trading-lib

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: ig-login-light
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: ig-login-dark
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight

extra_css:
  - stylesheets/ig-theme.css

extra:
  version:
    provider: mike
    default: latest

nav:
  - Overview: index.md
  - API guide:
      - Getting started: getting-started.md
      - HTTP requests: api-guide/http-requests.md
      - Authentication and authorisation: api-guide/authentication-and-authorisation.md
      - Paging: api-guide/paging.md
      - Errors: api-guide/errors.md
      - Trading safety: api-guide/trading-safety.md
  - REST API reference:
      - Login: rest-api-reference/login.md
      - Account: rest-api-reference/account.md
      - Markets: rest-api-reference/markets.md
      - Watchlists: rest-api-reference/watchlists.md
      - Client sentiment: rest-api-reference/client-sentiment.md
      - Indicative costs and charges: rest-api-reference/indicative-costs-and-charges.md
      - Dealing: rest-api-reference/dealing.md
      - General: rest-api-reference/general.md
  - Streaming API: streaming-api.md
  - Recipes: recipes/index.md
  - Library reference:
      - Agent API index: reference/agent-api-index.md
      - Public API: reference/public-api.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            heading_level: 3
            members_order: source
            separate_signature: true
            show_object_full_path: false
            show_root_heading: false
            show_signature_annotations: true
            show_source: false

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [.]
