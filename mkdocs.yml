site_name: IG Trading Library
site_description: Safe, typed synchronous and asynchronous IG REST and streaming clients.
site_url: https://evgesha9400.github.io/ig-trading-lib
repo_url: https://github.com/evgesha9400/ig-trading-lib
repo_name: evgesha9400/ig-trading-lib

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Safety: guides/safety.md
  - Reference:
      - Public API: reference/public-api.md
      - Endpoint matrix: reference/endpoint-matrix.md
      - Migrate from v2: migration-v2-to-v3.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            members_order: source
            separate_signature: true
            show_object_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
